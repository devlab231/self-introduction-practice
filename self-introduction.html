<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自己紹介 - xxxx</title>
</head>
<body>
    <h1>自己紹介</h1>
    
    <h2>プロフィール</h2>
    <p>名前：xxxx</p>
    <p>年齢：xx</p>
    <p>出身地：xx</p>
    <p>趣味：IT勉強、読書</p>
    
    <h2>好きなもの</h2>
    <ul>
        <li>果物</li>
        <li>野菜</li>
        <li>魚</li>
    </ul>
    
    <h2>今年の目標</h2>
    <ol>
        <li>開発の知見を身に着ける</li>
        <li>脆弱性診断のポートフォリオ作成</li>
        <li>PortSwigerのスコアを上げる</li>
    </ol>
    
    <h2>リンク</h2>
    <a href="https://github.com/devlab231" target="_blank">私のGitHub</a>
    
    <h2>好きな風景</h2>
    <img src="landscape.jpg" alt="好きな風景" width="400">

    <h2>お問い合わせ</h2>
    <form action="/submit" method="POST">
            
        <div>
            <label for="name">お名前:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div>
            <label for="category">お問い合わせ種別：</label>
            <select name="category">
                <option value="">-- 選択してください --</option>
                <option value="general">一般的なお問い合わせ</option>
                <option value="requests">ご意見・ご要望</option>
            </select>
        </div>

        <div>
            <label for="contact-message">お問い合わせ内容：</label>
            <textarea id="contact-message" name="message" rows="5" required></textarea>
        </div>

        <div>
            <button type="submit">送信する</button>
        </div>

    </form>

</body>
</html>
